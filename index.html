<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desde 2023 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* FUNDO ROMÂNTICO */
body{
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
color:white;
background: radial-gradient(circle at center, #0f172a, #020617);
}

/* LUZ SUAVE */
body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
animation: glow 10s infinite alternate;
}

@keyframes glow{
from{transform:translate(-20%,-20%);}
to{transform:translate(20%,20%);}
}

/* INTRO */
.intro{
position:absolute;
width:100%;
height:100%;
background:black;
display:flex;
align-items:center;
justify-content:center;
z-index:10;
animation: fadeOut 3s forwards 3s;
}

.intro-text{
font-size:1.5rem;
opacity:0;
animation: fadeIn 2s forwards;
text-align:center;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes fadeOut{to{opacity:0; visibility:hidden;}}

/* CONTAINER */
.container{
z-index:2;
width:90%;
max-width:420px;
padding:25px;
border-radius:20px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
box-shadow:0 0 60px rgba(0,0,0,0.8);
text-align:center;

opacity:0;
transform:translateY(20px);
animation: fadeUp 1.5s forwards 3.5s;
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

.title{
font-size:1.6rem;
margin-bottom:10px;
}

/* TEXTO */
.typing{
font-size:.9rem;
opacity:.8;
min-height:40px;
margin-bottom:10px;
}

/* MENSAGEM EXTRA */
.love{
font-size:.85rem;
opacity:.7;
margin-bottom:15px;
color:#1db954;
}

/* CLOCK */
.clock{
display:flex;
justify-content:center;
gap:6px;
margin:20px 0;
flex-wrap:wrap;
}

.time-box{
padding:8px;
border-radius:10px;
background:rgba(255,255,255,0.08);
font-size:.75rem;
}

/* PLAYER */
.player{
margin-top:20px;
padding:15px;
border-radius:15px;
background:rgba(0,0,0,0.6);
}

.top{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.cover{
width:55px;
height:55px;
border-radius:10px;
background:url('https://i.imgur.com/UTirfut.jpg') center/cover;
}

.music-title{
font-size:.9rem;
font-weight:600;
}

.music-artist{
font-size:.75rem;
opacity:.6;
}

/* PROGRESS */
.progress{
height:4px;
background:#444;
border-radius:10px;
margin:10px 0;
cursor:pointer;
}

.bar{
height:100%;
width:0%;
background:#1db954;
}

/* CONTROLES */
.controls{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
}

.play{
width:40px;
height:40px;
border-radius:50%;
background:#1db954;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
}

.play:hover{
transform:scale(1.1);
box-shadow:0 0 10px #1db954;
}

/* VOLUME */
.volume{
display:flex;
align-items:center;
gap:5px;
}

#volumeSlider{
-webkit-appearance:none;
width:70px;
height:4px;
background:#444;
border-radius:10px;
outline:none;
cursor:pointer;
}

#volumeSlider::-webkit-slider-thumb{
-webkit-appearance:none;
width:12px;
height:12px;
background:#1db954;
border-radius:50%;
}

/* CORAÇÃO */
.heart{
position:absolute;
animation: float 2s forwards;
}

@keyframes float{
to{
transform:translateY(-150px);
opacity:0;
}
}

</style>
</head>

<body>

<div class="intro">
<div class="intro-text">uma história que começou em 2023...</div>
</div>

<div class="container">

<div class="title">Desde 2023 💖</div>

<div class="typing" id="typing"></div>

<div class="love">Paula, eu te amo muito 💖</div>

<div class="clock">
<div class="time-box"><span id="years"></span><br>Anos</div>
<div class="time-box"><span id="days"></span><br>Dias</div>
<div class="time-box"><span id="hours"></span><br>Horas</div>
<div class="time-box"><span id="minutes"></span><br>Min</div>
<div class="time-box"><span id="seconds"></span><br>Seg</div>
</div>

<div class="player">

<div class="top">
<div class="cover"></div>
<div>
<div class="music-title">MC Kevin - Cavalo de Troia (GR6 Filmes) Djay W</div>
<div class="music-artist">MC KEVIN</div>
</div>
</div>

<div class="progress" onclick="setProgress(event)">
<div class="bar" id="bar"></div>
</div>

<div style="display:flex; justify-content:space-between; font-size:.8rem;">
<span id="cur">0:00</span>
<span id="dur">0:00</span>
</div>

<div class="controls">

<div class="play" id="playBtn" onclick="togglePlay()">▶️</div>

<div class="volume">
🔊
<input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1">
</div>

</div>

<audio id="audio" preload="auto">
<source src="musica.mp3" type="audio/mpeg">
</audio>

</div>

</div>

<script>

/* TEXTO */
const text=[
"mesmo sem a gente ter se encontrado ainda...",
"você já é importante pra mim",
"e eu quero viver isso com você 💖"
];

let line=0,char=0;
function type(){
if(line<text.length){
if(char<text[line].length){
typing.innerHTML+=text[line][char];
char++;
setTimeout(type,40);
}else{
typing.innerHTML+="<br>";
line++;char=0;
setTimeout(type,800);
}}}
setTimeout(type,3500);

/* RELÓGIO */
const start=new Date("2023-01-01");
setInterval(()=>{
let d=new Date()-start;
years.innerText=Math.floor(d/31536000000);
days.innerText=Math.floor(d/86400000)%365;
hours.innerText=Math.floor(d/3600000)%24;
minutes.innerText=Math.floor(d/60000)%60;
seconds.innerText=Math.floor(d/1000)%60;
},1000);

/* PLAYER */
const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const bar=document.getElementById("bar");
const volumeSlider=document.getElementById("volumeSlider");

/* PLAY */
function togglePlay(){
if(audio.paused){
audio.play().then(()=>{
playBtn.innerHTML="⏸️";
}).catch(()=>{
alert("clica de novo pra ativar o áudio");
});
}else{
audio.pause();
playBtn.innerHTML="▶️";
}
}

/* VOLUME */
volumeSlider.addEventListener("input",()=>{
audio.volume=volumeSlider.value;
});

/* PROGRESS */
audio.ontimeupdate=()=>{
if(audio.duration){
let p=(audio.currentTime/audio.duration)*100;
bar.style.width=p+"%";
cur.innerText=format(audio.currentTime);
dur.innerText=format(audio.duration);
}
};

function format(t){
let m=Math.floor(t/60);
let s=Math.floor(t%60);
return m+":"+(s<10?"0"+s:s);
}

function setProgress(e){
let w=e.currentTarget.clientWidth;
audio.currentTime=(e.offsetX/w)*audio.duration;
}

/* CORAÇÃO */
document.addEventListener("click",e=>{
let h=document.createElement("div");
h.className="heart";
h.innerText="💖";
h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),2000);
});

</script>

</body>
</html>
